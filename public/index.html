<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Project Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header>
        <h1>Team Project Tracker</h1>
        <nav>
            <button class="nav-btn active" data-section="projects">Projects</button>
            <button class="nav-btn" data-section="users">Users</button>
            <button class="nav-btn" data-section="tasks">Tasks</button>
        </nav>
    </header>

    <main>
        <section id="projects" class="section active">
            <h2>Projects</h2>
            <button id="addProjectBtn" class="btn-primary">+ New Project</button>
            <div id="projectList" class="card-list"></div>
        </section>

        <section id="users" class="section">
            <h2>Users</h2>
            <button id="addUserBtn" class="btn-primary">+ New User</button>
            <div id="userList" class="card-list"></div>
        </section>

        <section id="tasks" class="section">
            <h2>Tasks</h2>
            <button id="addTaskBtn" class="btn-primary">+ New Task</button>
            <div id="taskFilters">
                <h4>Filters</h4>
                <select id="filterStatus">
                    <option value="">All Status</option>
                    <option value="todo">Todo</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
                <select id="filterPriority">
                    <option value="">All Priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div id="taskList" class="card-list"></div>
        </section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
